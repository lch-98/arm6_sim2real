# 실물(Damiao) 전용 덮어쓰기 — real.launch.py 가 controllers.yaml 다음에 읽는다
#
# MIT 위치 제어는 비례 제어라서 정지 오차 ≈ 부하 토크 ÷ kp 만큼 남는다.
#   예: 1단계 레버 0.49 N·m, kp 20 → 약 25 mrad
#       팔 J2 홈 자세 약 3 N·m, kp 20 → 약 150 mrad (중력 피드포워드 전)
# 시뮬레이션 기준 도착 허용 오차(0.03 rad)로는 실물에서 궤적이 중단되므로 처음에는 넓게 둔다.
# 3단계에서 중력 토크 피드포워드와 게인을 조정한 뒤 다시 좁힌다.
arm_controller:
  ros__parameters:
    constraints:
      goal_time: 3.0
      joint1: {trajectory: 0.25, goal: 0.2}
      joint2: {trajectory: 0.25, goal: 0.2}
      joint3: {trajectory: 0.25, goal: 0.2}
      joint4: {trajectory: 0.25, goal: 0.2}
      joint5: {trajectory: 0.25, goal: 0.2}
      joint6: {trajectory: 0.25, goal: 0.2}

gripper_controller:
  ros__parameters:
    constraints:
      goal_time: 2.0
      finger_left_joint: {trajectory: 0.01, goal: 0.005}
      finger_right_joint: {trajectory: 0.01, goal: 0.005}
